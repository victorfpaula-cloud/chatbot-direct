name: Lembrete de reserva (WhatsApp)

# Substitui o Cron da Vercel pra essa rota — o plano gratuito da Vercel só roda cron 1x por dia
# num horário fixo, e o lembrete de reserva (src/lib/lembreteDeReserva.ts) foi escrito esperando
# rodar a cada 10-15min: cada conta tem seu próprio horário configurado (reserva_lembrete_horario)
# e o código dispara no primeiro run em ou depois desse horário, sem repetir no mesmo dia. Com o
# cron rodando só 1x/dia, funcionava por coincidência só pra conta cujo horário batesse exatamente
# com o horário do cron — qualquer conta com outro horário nunca recebia o lembrete. Repositório é
# público, então execução de Actions aqui não tem custo nem limite de minutos.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  disparar:
    runs-on: ubuntu-latest
    steps:
      - name: Chama a rota de lembrete de reserva
        run: |
          curl --fail --silent --show-error \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://chatbot-direct.vercel.app/api/cron/lembrete-reservas"
